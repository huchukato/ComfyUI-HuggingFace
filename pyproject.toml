[project]
name = "ComfyUI-HuggingFace"
description = "HuggingFace seamlessly integrates Civitai's vast model repository directly into ComfyUI, allowing you to search, download, and organize AI models without leaving your workflow."
version = "1.1.0"
license = {file = "LICENSE"}
dependencies = [
    "huggingface_hub>=0.20.0",
    "requests>=2.25.0"
]

[project.urls]
Repository = "https://github.com/huchukato/ComfyUI-HuggingFace"

[tool.comfy]
PublisherId = "huchukato"
DisplayName = "ComfyUI-HuggingFace"
Icon = "https://raw.githubusercontent.com/huchukato/ComfyUI-HuggingFace/main/icon.png"
Banner = "https://raw.githubusercontent.com/huchukato/ComfyUI-HuggingFace/main/banner.png"
requires-comfyui = ">=1.0.0"
